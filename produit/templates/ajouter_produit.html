{% extends page_temp %}
{% block title %}Produit et catégorie{% endblock%} {% block header %}Produit et
catégorie{% endblock %} {% block main %}
<div class="px-2">
  <div class=" rounded-b-lg relative shadow-lg">
    <div class="px-10 pb-5">
      <div class="mb-5">
        <h3
          class="text-slate-500 font-bold text-xl border-b-2 inline-block my-6"
        >
          Ajouter Une Catégorie:
        </h3>
        <form method="post" action="{% url 'produit:ajouter' %}">
          {% csrf_token %}
          <div class="flex flex-col">
            <div class="mb-4">
              <label class="block text-gray-700 font-bold mb-2" for="parent_category">
                Catégorie principale
              </label>
              <select
                class="border rounded-lg py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="parent_category"
                name="parent_category"
              >
                <option value="">-- Catégorie principale --</option>
                {% for category in main_categories %}
                <option value="{{ category.id }}">{{ category.nom }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="mb-4">
              <label class="block text-gray-700 font-bold mb-2" for="nom">
                Nom de la sous-catégorie
              </label>
              <input
                class="border rounded-lg py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="nom"
                type="text"
                name="nom"
                required
              />
            </div>
            <div class="mb-4">
              <label
                class="block text-gray-700 font-bold mb-2"
                for="description"
              >
                Description
              </label>
              <textarea
                class="border rounded-lg py-2 px-3 w-full h-20 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="description"
                name="description"
                required
              ></textarea>
            </div>
          </div>
          <button
            class="bg-sky-950 w-1/3  hover:bg-sky-900 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline  mx-auto flex justify-center"
            type="submit"
            name="ajouter_categorie"
          >
            Ajouter Catégorie
          </button>
        </form>
      </div>
      <hr />
      <div>
        <h3
          class="text-slate-500 font-bold text-xl border-b-2 inline-block my-6"
        >
          Ajouter Un Produit:
        </h3>
        <form method="post" action="{% url 'produit:ajouter' %}">
          {% csrf_token %}
          <div class="grid grid-cols-2 gap-x-7">
            <div class="mb-4">
              <label class="block text-gray-700 font-bold mb-2" for="libelle">
                Libellé du produit
              </label>
              <input
                class="border w-full rounded-lg py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="libelle"
                type="text"
                name="libelle"
                required
              />
            </div>
            <div class="mb-4">
              <label class="block text-gray-700 font-bold mb-2" for="reference">
                Référence du produit
              </label>
              <input
                class="border w-full rounded-lg py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="reference"
                type="text"
                name="reference"
                required
              />
            </div>
            <div class="mb-4">
              <label class="block text-gray-700 font-bold mb-2" for="categorie">
                Catégorie du produit
              </label>
              <select
                class="border w-full rounded-lg py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="categorie"
                name="categorie"
                required
              >
                <option value="">-- Sélectionner une catégorie --</option>
                {% for option in category_filter_options %}
                <option value="{{ option.value }}" {% if option.disabled %}disabled{% endif %} {% if selected_category_id == option.value and not option.disabled %}selected{% endif %}>{{ option.label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="mb-4">
              <label class="block text-gray-700 font-bold mb-2" for="detaille">
                Détails du produit
              </label>
              <textarea
                class="border w-full rounded-lg py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="detaille"
                name="detaille"
              ></textarea>
            </div>
          </div>
          <button
            class="bg-sky-950 w-1/3  hover:bg-sky-900 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline  mx-auto flex justify-center"
            type="submit"
            name="ajouter_produit"
          >
            Ajouter Produit
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
