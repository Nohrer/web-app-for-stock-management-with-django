{% load static %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>{% block title %}{% endblock %}</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap');
      *{
        font-family: 'Noto Sans',sans;
      }

      /* Global form field visibility */
      input:not([type='checkbox']):not([type='radio']):not([type='hidden']):not([type='range']):not([type='button']):not([type='submit']):not([type='reset']),
      select,
      textarea {
        border: 1px solid #cbd5e1;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
      }

      input:not([type='checkbox']):not([type='radio']):not([type='hidden']):not([type='range']):not([type='button']):not([type='submit']):not([type='reset']):focus,
      select:focus,
      textarea:focus {
        border-color: #0ea5e9;
        box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.15);
        outline: none;
      }

      @media print {
        @page {
          margin: 0;
        }
        body {
          margin: 2cm;
        }
      }
    </style>
  </head>
  <body class="leading-normal tracking-normal ">
    {% if messages %}
      <div class="fixed top-4 right-4 z-50 space-y-2 max-w-md">
        {% for message in messages %}
          <div class="flex items-center px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium
            {% if message.tags == 'success' %}bg-green-500
            {% elif message.tags == 'error' %}bg-red-500
            {% elif message.tags == 'warning' %}bg-amber-500
            {% elif message.tags == 'info' %}bg-blue-500
            {% else %}bg-sky-600{% endif %}"
            role="alert">
            <span class="flex-1">{{ message }}</span>
            <button type="button" class="ml-4 text-white hover:text-gray-200" onclick="this.parentElement.remove()">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
              </svg>
            </button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %} {% endblock %}
  </body>
</html>
