{% load static %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>{% block title %}{% endblock %}</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap');
      *{
        font-family: 'Noto Sans',sans;
      }

      /* Global form field visibility */
      input:not([type='checkbox']):not([type='radio']):not([type='hidden']):not([type='range']):not([type='button']):not([type='submit']):not([type='reset']),
      select,
      textarea {
        border: 1px solid #cbd5e1;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
      }

      input:not([type='checkbox']):not([type='radio']):not([type='hidden']):not([type='range']):not([type='button']):not([type='submit']):not([type='reset']):focus,
      select:focus,
      textarea:focus {
        border-color: #0ea5e9;
        box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.15);
        outline: none;
      }

      @media print {
        @page {
          margin: 0;
        }
        body {
          margin: 2cm;
        }
      }
    </style>
  </head>
  <body class="leading-normal tracking-normal ">
    {% block content %} {% endblock %}
  </body>
</html>
